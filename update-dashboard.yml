name: Update G10 dashboard data

on:
  schedule:
    # 11:00 UTC, Monday-Friday (after most Asia/Europe releases, before the
    # US afternoon). Edit the cron below to change the time — cron is UTC.
    - cron: "0 11 * * 1-5"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh data.json via Claude API
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/update_data.py

      - name: Commit and push if data changed
        run: |
          git config user.name "g10-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- data.json; then
            git add data.json
            git commit -m "Daily data refresh: $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No changes to data.json, nothing to commit."
          fi
